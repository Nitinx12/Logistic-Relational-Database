# API contract: source of truth for Pydantic client generation.
openapi: 3.0.3
info:
  title: LRDB Action API
  version: 0.1.0
  description: Validated business actions over MongoDB.
servers:
  - url: http://localhost:8080
paths:
  /v1/loads:
    post:
      summary: Create a load
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
        - name: X-Actor
          in: header
          schema: {type: string}
        - name: X-Trace-Id
          in: header
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoadRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadFacts' }
        '202':
          description: Requires confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Confirmation' }
        '422':
          description: Validation error
  /v1/loads/{id}:
    get:
      summary: Get load by id
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadFacts' }
components:
  schemas:
    CreateLoadRequest:
      type: object
      required: [customer_id, route_id, load_type, weight_lbs, pieces, revenue]
      properties:
        customer_id: {type: string}
        route_id: {type: string}
        load_type: {type: string}
        weight_lbs: {type: integer, minimum: 1}
        pieces: {type: integer, minimum: 1}
        revenue: {type: number, minimum: 0}
      additionalProperties: false
    LoadFacts:
      type: object
      properties:
        load_id: {type: string}
        customer_id: {type: string}
        route_id: {type: string}
        load_date: {type: string, format: date}
        revenue: {type: number}
      additionalProperties: true
    Confirmation:
      type: object
      properties:
        status: {type: integer}
        confirmation_token: {type: string}
        message: {type: string}
