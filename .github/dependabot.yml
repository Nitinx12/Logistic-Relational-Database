# Dependabot grouped weekly per arch 5.6.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: {interval: weekly}
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: "/agent-service"
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: "/"
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
