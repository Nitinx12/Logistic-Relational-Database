# Databricks Asset Bundle for topology C (later).
bundle:
  name: lrdb
targets:
  dev:
    mode: development
    workspace:
      host: ${DATABRICKS_HOST}
    resources:
      jobs:
        pipeline:
          name: lrdb-pipeline
          job_clusters:
            - job_cluster_key: lrdb
              new_cluster:
                spark_version: 13.3.x-scala2.12
                node_type_id: i3.xlarge
                num_workers: 1
          tasks:
            - task_key: bronze
              job_cluster_key: lrdb
              spark_jar_task:
                main_class_name: com.example.spark.Pipeline
